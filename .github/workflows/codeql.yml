name: codeql
# CodeQL scans the Go code for security bugs (SAST) and shows what it finds in the Security tab.
# It runs once a week on main and on each release tag, not on every push or pull request: a scan takes about
# 40 minutes and holds one of the account's 20 runner slots all that time. Every commit on public main is a
# release and gets a tag, so every shipped commit is scanned. A release does not wait for this scan.
on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "41 4 * * 3"
permissions:
  contents: read
jobs:
  analyze:
    if: github.repository == 'nrndev/pogi' # runs only in the public repo, not in forks or mirrors
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write # upload the results to the Security tab
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: go
          build-mode: autobuild
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:go
