name: preflight
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A newer push cancels the run still going for the same branch.
concurrency:
  group: preflight-${{ github.ref }}
  cancel-in-progress: true
# proxy.golang.org sometimes drops a module download halfway ("stream error ... INTERNAL_ERROR"). With no module
# cache every job downloads its modules afresh, so one dropped download used to fail a job. "|" tells Go to try the
# next entry on any error, so listing the proxy twice retries a failed download once (Go empties the half-written
# file first). ",direct" is Go's default: fetch from the source only when the proxy does not have a module.
env:
  GOPROXY: https://proxy.golang.org|https://proxy.golang.org,direct
# Every job calls scripts/ci.sh, so the same checks run on a laptop: scripts/ci.sh [step ...].
#
# Jobs: plan (the list of test groups), 7 "lint and test" jobs, 8 conformance jobs, one "config" job (config
# checks and security scans) and one "cross" job: 18 at once. The free plan allows 20 at once for the whole
# account. CodeQL and the scheduled scans run weekly and on release tags, not here, but may hold a slot when
# they do, so stay at 18 or fewer.
#
# No caches. Every job starts cold, so every run takes about the same time and there is nothing to keep up.
# setup-go's own cache is off. The slowest jobs are bound by the azurerm provider's own waits, not by compiling.
#
# Lint runs inside the test jobs, not in a job of its own. About 80% of lint is compiling the cloud SDK clients
# that only tests import. A test job lints its group first with the same build flags as its tests (-race), so
# the tests reuse that compile and only the test mains are left. That costs a test job about 18% more, and a
# separate lint job would compile the same code again.
jobs:
  # The list of test groups comes from scripts/ci.sh, the only place they are defined.
  plan:
    if: github.repository == 'nrndev/pogi' # runs only in the public repo, not in forks or mirrors
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.groups.outputs.list }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: groups
        run: echo "list=$(scripts/ci.sh groups | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
  # One cross build for three platforms, one after the other. Pogi has OS-specific files (internal/core) but none
  # that depend on the architecture, the other jobs build linux/amd64, and GoReleaser builds all six at release,
  # so these three cover every OS and the two other architectures.
  cross:
    if: github.repository == 'nrndev/pogi' # runs only in the public repo, not in forks or mirrors
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - run: scripts/ci.sh cross windows/amd64 darwin/arm64 linux/arm64
  # The config files, then the security scans. Config: gofmt finds nothing to change (it also checks files lint
  # does not load), every package is in one test group, the workflows are clean (actionlint, zizmor), and the
  # release config is valid. Then the scans below.
  config:
    if: github.repository == 'nrndev/pogi' # runs only in the public repo, not in forks or mirrors
    runs-on: ubuntu-latest
    timeout-minutes: 15 # the image build compiles pogi inside Docker
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      # The release config (signing, SBOMs, images, brew, scoop), checked on every push, not first at tag time.
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: v2.18.3 # pinned goreleaser: a new release may deprecate a field and fail the check
          install-only: true
      - run: pipx install zizmor==1.30.1 # pinned zizmor
      - run: scripts/ci.sh fmt coverage release-check workflows
        env:
          GH_TOKEN: ${{ github.token }} # for the zizmor audits that ask GitHub
      # govulncheck fails if pogi's code calls a Go module with a known vulnerability. Trivy fails on fixable
      # HIGH or CRITICAL vulnerabilities and on secrets. Config scanning (Dockerfiles, examples/terraform) only
      # reports, because the owner is still picking which findings to fix.
      # "image" builds Dockerfile and runs Trivy on it, and fails on a fixable HIGH or CRITICAL CVE. The image
      # that ships (Dockerfile.release, built by GoReleaser) has the same Alpine base and apk packages, so this
      # covers what ships. Docker is on the runner; the Trivy image is pinned in scripts/security-scan.sh.
      - if: ${{ !cancelled() }} # run the scans even when a config check failed, so one run shows both
        run: scripts/ci.sh security vuln trivy image
  # Lint and the race tests, one job per group, so a red job names its area. Lint (golangci-lint, config
  # .golangci.yml) runs first with the tests' own build flags (-race), so it compiles the cloud SDK clients once
  # and the tests reuse them. That is cheaper than a lint job of its own. Tests that need Docker (Kubernetes,
  # databases, EC2, ECS and the other container-backed services) skip themselves here: DOCKER_HOST points at
  # nothing. They run on a developer machine in the full gate (scripts/ci.sh gate) before every release. A
  # package that hangs fails after 8 minutes with every goroutine's stack. gotestsum prints a short log, writes
  # JUnit XML, and puts the totals and the failed tests in the job summary.
  test:
    needs: plan
    if: github.repository == 'nrndev/pogi' # runs only in the public repo, not in forks or mirrors
    name: lint and test (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups || '[]') }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0 # pinned golangci-lint: a new release may add checks that fail the build
          install-only: true
          skip-cache: true # no result cache saved or restored
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: lint (${{ matrix.group }})
        run: scripts/ci.sh lint "$GROUP"
        env:
          GROUP: ${{ matrix.group }}
      - name: race tests (${{ matrix.group }})
        run: scripts/ci.sh test "$GROUP"
        env:
          GROUP: ${{ matrix.group }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: test-results-${{ matrix.group }}
          path: test-results
          retention-days: 7
          if-no-files-found: ignore
  # Real Terraform and CDK projects against a fresh pogi, one job per entry, side by side. Docker is on here:
  # the compute and azurerm blocks need it. Terraform providers and npm packages are downloaded on each run (no
  # cache of them). TF_PLUGIN_CACHE_DIR only shares a download between the blocks of one job.
  conformance:
    if: github.repository == 'nrndev/pogi' # runs only in the public repo, not in forks or mirrors
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: conformance (${{ matrix.blocks }})
    strategy:
      fail-fast: false
      matrix:
        # Each entry is the blocks one job runs, one after the other (scripts/conformance.sh takes several).
        # Balanced by the time each takes, so every job runs about 7 to 8 minutes, set-up included: the azurerm
        # provider waits minutes on some deletes (ALB 5 min, hubs 5 min, policy 5 min, key vault 2 min), so each
        # of those has a job. A "terraform-<cloud>-thin-<group>" example folder is the block <google|azurerm|aws>-<group>;
        # "scripts/ci.sh coverage" fails when a folder is in no entry.
        blocks:
          - "azurerm-a2-alb"
          - "azurerm-a2-hubs"
          - "azurerm-a2-policy"
          - "azurerm"
          - "aws aws-c"
          - "azurerm-a2-data azurerm-a2-net google google-thin"
          - "azurerm-a2-sec longtail aws-aws-b"
          - "aws-aws-a compute azurerm-a2-compute cdk"
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tf-plugins
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
      # $BLOCKS is one argument with a block name per word; conformance.sh reads it as a list.
      - run: scripts/ci.sh conformance "$BLOCKS"
        env:
          BLOCKS: ${{ matrix.blocks }}
