name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
# Tests and conformance ran in preflight on the tagged commit; this workflow checks that and scans for known
# vulnerabilities again, then builds, signs and publishes, then smoke-tests and scans what it published.
jobs:
  preflight-passed:
    if: github.repository == 'nrndev/pogi' # runs only in the public repo, not in forks or mirrors
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # the preflight runs of the tagged commit
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: preflight passed on ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          c=$(gh api "repos/$REPO/actions/workflows/preflight.yml/runs?head_sha=$SHA&status=completed" --jq '.workflow_runs[0].conclusion')
          echo "preflight: ${c:-no completed run}"
          [ "$c" = success ] || { echo "preflight has not passed on this commit; nothing is published."; exit 1; }
  # The preflight scans again, with today's list of known vulnerabilities: one can be published after preflight
  # passed. govulncheck, Trivy on the tree (fixable HIGH or CRITICAL CVEs, secrets) and Trivy on an image built
  # from Dockerfile. That image stands in for the ones GoReleaser builds: Dockerfile.release has the same final
  # stage (the pinned Alpine and the same apk line), and both use the same Go and build flags. A finding fails
  # this job, and nothing is published.
  scan:
    if: github.repository == 'nrndev/pogi' # runs only in the public repo, not in forks or mirrors
    runs-on: ubuntu-latest
    timeout-minutes: 15 # the image build compiles pogi inside Docker
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - run: scripts/ci.sh security vuln trivy image
  goreleaser:
    needs: [preflight-passed, scan]
    if: github.repository == 'nrndev/pogi' # runs only in the public repo, not in forks or mirrors
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # the GitHub release
      packages: write # the GHCR image
      id-token: write # keyless cosign signatures and build-provenance attestations
      attestations: write # build-provenance attestations
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }} # the release files' checksums, for the provenance job
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false # a release is built from a clean cache
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          cache-image: false # no caches in the release, like preflight
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # A one-hour token from the nrndev release GitHub App, allowed to write only to the Homebrew tap
      # and the Scoop bucket. The app's client ID is a repo variable; its private key is a secret.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: tap-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: nrndev
          repositories: homebrew-tap,scoop-bucket
          permission-contents: write # the tap and the bucket need nothing more
      # The release page notes are this version's CHANGELOG.md section.
      - run: scripts/ci.sh notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: v2.18.3 # pinned: a new release may deprecate a field and fail the check
          args: release --clean --release-notes=${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap-token.outputs.token }} # used for the tap and the bucket
      # Every file GoReleaser checksummed, as "sha256  name" lines in base64: what the SLSA generator signs.
      - id: hashes
        run: echo "hashes=$(base64 -w0 < dist/checksums.txt)" >> "$GITHUB_OUTPUT"
      # GitHub's build provenance for every archive, package and the checksums (verify with gh attestation verify).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
  # SLSA provenance for the same files, as pogi.intoto.jsonl on the release page (verify with slsa-verifier), next to
  # GitHub's attestations above. The SLSA generator must be referenced by tag, not by commit SHA: it checks its own
  # ref to prove which builder made the provenance. So this is the one action here that is pinned by tag.
  provenance:
    needs: goreleaser
    if: github.repository == 'nrndev/pogi' # runs only in the public repo, not in forks or mirrors
    permissions:
      actions: read # the generator reads this workflow run
      id-token: write # signs the provenance
      contents: write # uploads it to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses]
    with:
      base64-subjects: ${{ needs.goreleaser.outputs.hashes }}
      upload-assets: true
      provenance-name: pogi.intoto.jsonl
  # What people install, installed: Homebrew on macOS, the Linux binary, and the image (which needs the GHCR
  # package to be public; until then that step only warns).
  smoke:
    needs: goreleaser
    if: github.repository == 'nrndev/pogi' # runs only in the public repo, not in forks or mirrors
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Harden-Runner works on Linux runners only.
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        if: runner.os == 'Linux'
        with:
          egress-policy: audit
      - name: brew install
        if: runner.os == 'macOS' && !contains(github.ref_name, '-') # a pre-release (v0.2.0-rc.1) isn't in the tap
        run: brew install nrndev/tap/pogi && pogi version | grep -F "${GITHUB_REF_NAME#v}"
      - name: release binary
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p '*linux_amd64.tar.gz' -p checksums.txt
          sha256sum --ignore-missing -c checksums.txt
          tar xzf ./*linux_amd64.tar.gz pogi && ./pogi version | grep -F "${GITHUB_REF_NAME#v}"
      - name: apt install the .deb
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p '*linux_amd64.deb'
          sha256sum --ignore-missing -c checksums.txt
          sudo apt-get install -y ./*linux_amd64.deb && /usr/bin/pogi version | grep -F "${GITHUB_REF_NAME#v}"
      - name: docker run
        if: runner.os == 'Linux'
        run: |
          if docker pull "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME#v}"; then
            docker run --rm --entrypoint pogi "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME#v}" version
          else
            echo "::warning::the image is not public yet: make the GHCR package public, then rerun this job"
          fi
  # The exact image just published, scanned by the weekly image-scan workflow: the results go to the Security tab.
  # It cannot stop the release, which is already out. A finding fails this job, so GitHub emails the owner.
  image-scan:
    needs: goreleaser
    if: github.repository == 'nrndev/pogi' # runs only in the public repo, not in forks or mirrors
    permissions:
      contents: read
      security-events: write # upload the results to the Security tab
    uses: ./.github/workflows/image-scan.yml # zizmor: ignore[self-repository] the pinned actionlint rejects the newer $/ form
    with:
      tag: ${{ github.ref_name }}
