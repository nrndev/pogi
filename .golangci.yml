# golangci-lint v2. A small, strict set: every finding is fixed or excluded below with a reason.
version: "2"
run:
  # CI has no cache, so every run is cold. A test job lints one group of packages on a 4-core runner, about a
  # minute and a half. Linting every package (a release, the gate) takes a few minutes on a laptop.
  timeout: 25m
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - ineffassign
    - unused
  settings:
    govet:
      # Every analyzer that "go vet" runs (the list of "go tool vet help"), so the vet CI step is not needed.
      # golangci-lint's default set may leave some out. Check this list again when the Go version changes.
      enable: [appends, asmdecl, assign, atomic, bools, buildtag, cgocall, composites, copylocks, defers,
        directive, errorsas, framepointer, hostport, httpresponse, ifaceassert, loopclosure, lostcancel,
        nilfunc, printf, shift, sigchanyzer, slog, stdmethods, stdversion, stringintconv, structtag,
        testinggoroutine, tests, timeformat, unmarshal, unreachable, unsafeptr, unusedresult, waitgroup]
  exclusions:
    rules:
      # pogi's job is to answer like the real cloud, including with fields and calls the cloud SDKs now mark
      # deprecated. Tests use those old calls on purpose, and a few services serve them.
      - linters: [staticcheck]
        text: SA1019
        path: (_test\.go|internal/azure/keyvault/keys\.go|internal/gcp/(gke/gke|iam/iam|logging/config|pubsub/pubsub)\.go)$
      # Error texts are sent to clients and copy the cloud's own wording, so they keep its capital letters
      # and full stops.
      - linters: [staticcheck]
        text: ST1005
      # Suggestions to rewrite working conditions (De Morgan's law, tagged switch). The rewrite is often
      # harder to read than the original.
      - linters: [staticcheck]
        text: QF100[123]
formatters:
  enable:
    - gofmt
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
